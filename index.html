<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lalə üçün 🎂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    /* ─── RESET & ROOT ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:        #ff2d78;
      --pink-dim:    rgba(255, 45, 120, 0.18);
      --pink-glow:   rgba(255, 45, 120, 0.55);
      --bg:          #060608;
      --card-bg:     #0d0d12;
      --card-border: rgba(255, 45, 120, 0.35);
      --text-main:   #f5e6ee;
      --text-muted:  rgba(245,230,238,0.55);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text-main);
      font-family: 'Space Mono', monospace;
      overflow: hidden;
      cursor: default;
      /* prevent double-tap zoom on mobile */
      touch-action: manipulation;
    }

    /* ─── PHASES ─── */
    .phase {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.9s ease;
      z-index: 1;
    }
    .phase.hidden   { opacity: 0; pointer-events: none; z-index: 1; }
    .phase.visible  { opacity: 1; pointer-events: all;  z-index: 50; }

    /* ══════════════════════════════
       PHASE 1 — LANDING
    ══════════════════════════════ */
    #phase1 { background: var(--bg); }

    .start-btn {
      position: relative;
      padding: 18px 52px;
      background: transparent;
      border: 1.5px solid var(--pink);
      color: var(--pink);
      font-family: 'Space Mono', monospace;
      font-size: clamp(1rem, 5vw, 1.25rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      outline: none;
      transition: background 0.3s, color 0.3s, transform 0.15s;
      animation: borderPulse 2.2s ease-in-out infinite;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .start-btn::before, .start-btn::after {
      content: '';
      position: absolute;
      inset: -1px;
      border: 1.5px solid var(--pink);
      opacity: 0;
      animation: borderPulse 2.2s ease-in-out infinite;
    }
    .start-btn::before { animation-delay: 0.7s; }
    .start-btn::after  { animation-delay: 1.4s; }
    .start-btn:hover   { background: var(--pink-dim); transform: scale(1.04); }
    .start-btn:active  { transform: scale(0.97); }

    @keyframes borderPulse {
      0%   { box-shadow: 0 0 0px 0px var(--pink-glow); opacity: 1; }
      50%  { box-shadow: 0 0 22px 6px var(--pink-glow); opacity: 1; }
      100% { box-shadow: 0 0 0px 0px var(--pink-glow); opacity: 0; }
    }

    /* ══════════════════════════════
       PHASE 2 — MATRIX + COUNTDOWN
    ══════════════════════════════ */
    #phase2 { background: transparent; }

    #matrixCanvas {
      position: fixed;
      inset: 0;
      z-index: 2;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }
    #matrixCanvas.visible { opacity: 1; }

    .center-stage {
      position: relative;
      z-index: 5;
      text-align: center;
      user-select: none;
    }

    #countdownNum {
      font-family: 'Space Mono', monospace;
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 700;
      color: var(--pink);
      text-shadow: 0 0 40px var(--pink), 0 0 80px var(--pink-glow);
      opacity: 0;
      transform: scale(1.4);
      transition: opacity 0.1s ease, transform 0.15s ease;
      line-height: 1;
    }
    #countdownNum.show {
      opacity: 1;
      transform: scale(1);
    }

    /* Text drops */
    #wordDisplay {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 10vw, 7rem);
      font-weight: 300;
      letter-spacing: 0.18em;
      color: #fff;
      text-shadow: 0 0 30px var(--pink), 0 0 60px var(--pink-glow);
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.12s cubic-bezier(.22,1,.36,1), transform 0.15s cubic-bezier(.22,1,.36,1);
      line-height: 1;
      min-height: 1.15em;
    }
    #wordDisplay.show {
      opacity: 1;
      transform: scale(1);
    }

    /* ══════════════════════════════
       PHASE 3 — GREETING CARD
    ══════════════════════════════ */
    #phase3 {
      background: var(--bg);
      align-items: center;
      justify-content: center;
      perspective: 1400px;
      overflow: hidden;
    }

    /* Subtle ambient radial */
    #phase3::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 55% at 50% 50%, rgba(255,45,120,0.07) 0%, transparent 75%);
      pointer-events: none;
    }

    /* Floating particles (CSS only) */
    .particle {
      position: fixed;
      width: 2px; height: 2px;
      border-radius: 50%;
      background: var(--pink);
      opacity: 0;
      animation: floatUp linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      0%   { transform: translateY(100vh) translateX(0); opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.3; }
      100% { transform: translateY(-10vh) translateX(var(--drift)); opacity: 0; }
    }

    /* Card wrapper */
    #cardWrapper {
      position: relative;
      width: min(400px, 92vw);
      height: min(500px, 78svh);
      transform-style: preserve-3d;
      transition: transform 1.1s cubic-bezier(.45,.05,.1,1);
      cursor: pointer;
      flex-shrink: 0;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    #cardWrapper.opened {
      transform: rotateY(180deg);
    }
    @media (max-width: 480px) {
      #cardWrapper { width: 94vw; height: 76svh; }
      .letter-salutation { font-size: 1.25rem; }
      .letter-body { font-size: 1.05rem; }
    }

    /* Card faces */
    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    /* ── FRONT ── */
    #cardFront {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 0 40px rgba(255,45,120,0.12), 0 0 80px rgba(255,45,120,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .envelope-icon {
      position: relative;
      width: 100px;
      height: 72px;
      flex-shrink: 0;
    }
    .envelope-icon svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 12px var(--pink)) drop-shadow(0 0 28px var(--pink-glow));
      animation: envPulse 3s ease-in-out infinite;
    }
    @keyframes envPulse {
      0%,100% { filter: drop-shadow(0 0 10px var(--pink)) drop-shadow(0 0 25px var(--pink-glow)); }
      50%      { filter: drop-shadow(0 0 18px var(--pink)) drop-shadow(0 0 50px var(--pink-glow)); }
    }

    .tap-hint {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      animation: hintBlink 2.5s ease-in-out infinite;
    }
    @keyframes hintBlink {
      0%,100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }

    .front-deco {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .front-deco::before {
      content: '';
      position: absolute;
      top: -60px; left: -60px;
      width: 220px; height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,45,120,0.09) 0%, transparent 65%);
    }
    .front-deco::after {
      content: '';
      position: absolute;
      bottom: -60px; right: -60px;
      width: 220px; height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,45,120,0.09) 0%, transparent 65%);
    }

    /* Corner lines */
    .corner {
      position: absolute;
      width: 22px; height: 22px;
      border-color: var(--pink);
      border-style: solid;
      opacity: 0.5;
    }
    .corner-tl { top: 14px; left: 14px; border-width: 1.5px 0 0 1.5px; }
    .corner-tr { top: 14px; right: 14px; border-width: 1.5px 1.5px 0 0; }
    .corner-bl { bottom: 14px; left: 14px; border-width: 0 0 1.5px 1.5px; }
    .corner-br { bottom: 14px; right: 14px; border-width: 0 1.5px 1.5px 0; }

    /* ── BACK (letter) ── */
    #cardBack {
      background: linear-gradient(160deg, #0e0d14 0%, #100b10 100%);
      border: 1px solid var(--card-border);
      box-shadow: 0 0 40px rgba(255,45,120,0.15), 0 0 80px rgba(255,45,120,0.07);
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-header {
      padding: 24px 28px 16px;
      border-bottom: 1px solid rgba(255,45,120,0.15);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .card-header-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 8px var(--pink);
      animation: dotPulse 1.8s ease-in-out infinite;
    }
    @keyframes dotPulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }
    .card-header-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--pink);
    }

    .card-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px 28px;
      scrollbar-width: thin;
      scrollbar-color: var(--pink-dim) transparent;
    }
    .card-scroll::-webkit-scrollbar       { width: 3px; }
    .card-scroll::-webkit-scrollbar-track { background: transparent; }
    .card-scroll::-webkit-scrollbar-thumb { background: var(--pink-dim); border-radius: 2px; }

    .letter-salutation {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.3rem, 4vw, 1.6rem);
      font-weight: 400;
      color: var(--pink);
      margin-bottom: 20px;
      line-height: 1.3;
    }

    .letter-body {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1rem, 3vw, 1.2rem);
      font-weight: 300;
      font-style: italic;
      line-height: 1.85;
      color: var(--text-main);
      opacity: 0.88;
      /* ─────────────────────────────────────────────────────────
         ✏️  REPLACE THIS TEXT WITH YOUR OWN HEARTFELT MESSAGE
         ───────────────────────────────────────────────────────── */
    }

    .letter-footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,45,120,0.12);
      font-family: 'Space Mono', monospace;
      font-size: clamp(0.9rem, 3vw, 1.05rem);
      font-style: normal;
      font-weight: 700;
      color: var(--pink);
      text-align: right;
      letter-spacing: 0.08em;
      text-shadow: 0 0 10px var(--pink-glow);
      opacity: 1;
    }

    /* ══════════════════════════════
       UTILITIES
    ══════════════════════════════ */
    .sr-only { position: absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
  </style>
</head>
<body>

<!-- ══ AUDIO ══ -->
<audio id="music1" src="bgMusic1.mp3" loop preload="auto"></audio>
<audio id="music2" src="bgMusic2.mp3" loop preload="auto"></audio>

<!-- ══ MATRIX CANVAS ══ -->
<canvas id="matrixCanvas"></canvas>

<!-- ══════════════════════════════
     PHASE 1
══════════════════════════════ -->
<section id="phase1" class="phase visible" aria-label="Başlanğıc ekranı">
  <button class="start-btn" id="startBtn" aria-label="Başla">Başla!</button>
</section>

<!-- ══════════════════════════════
     PHASE 2
══════════════════════════════ -->
<section id="phase2" class="phase hidden" aria-label="Geri sayım">
  <div class="center-stage">
    <div id="countdownNum" aria-live="assertive"></div>
    <div id="wordDisplay"  aria-live="polite"></div>
  </div>
</section>

<!-- ══════════════════════════════
     PHASE 3
══════════════════════════════ -->
<section id="phase3" class="phase hidden" aria-label="Doğum günü kartı">

  <!-- ambient floating particles -->
  <div id="particles" aria-hidden="true"></div>

  <div id="cardWrapper" role="button" tabindex="0"
       aria-label="Kartı açmaq üçün klikləyin"
       aria-expanded="false">

    <!-- FRONT -->
    <div class="card-face" id="cardFront" aria-hidden="false">
      <div class="front-deco" aria-hidden="true"></div>
      <span class="corner corner-tl" aria-hidden="true"></span>
      <span class="corner corner-tr" aria-hidden="true"></span>
      <span class="corner corner-bl" aria-hidden="true"></span>
      <span class="corner corner-br" aria-hidden="true"></span>

      <div class="envelope-icon" aria-hidden="true">
        <!-- Envelope SVG -->
        <svg viewBox="0 0 100 72" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="96" height="68" rx="7" stroke="#ff2d78" stroke-width="2.5"/>
          <path d="M2 10 L50 44 L98 10" stroke="#ff2d78" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M2 62 L34 36" stroke="#ff2d78" stroke-width="2" opacity="0.55"/>
          <path d="M98 62 L66 36" stroke="#ff2d78" stroke-width="2" opacity="0.55"/>
        </svg>
      </div>

      <p class="tap-hint">Açmaq üçün toxun</p>
    </div>

    <!-- BACK (Letter) -->
    <div class="card-face" id="cardBack" aria-hidden="true">
      <div class="card-header">
        <span class="card-header-dot" aria-hidden="true"></span>
        <span class="card-header-title">Lalə üçün</span>
      </div>
      <div class="card-scroll">

        <p class="letter-salutation">Əzizim Lalə,</p>

        <div class="letter-body">
          Ad günün mübarək gözəlim. Həyatıma gəldiyin gündən həyat daha maraqlı oldu, gülüşün üzündən əksik olmasın ❤️
        </div>

        <div class="letter-footer">
          — Yetim
        </div>

      </div>
    </div>
  </div><!-- /cardWrapper -->

</section>

<script>
/* ════════════════════════════════════════════
   BIRTHDAY SITE — VANILLA JS CONTROLLER
   ════════════════════════════════════════════ */

const $ = id => document.getElementById(id);

/* ── Audio ── */
const music1 = $('music1');
const music2 = $('music2');
music1.volume = 0.75;
music2.volume = 0.0; // starts silent, fades in

function fadeIn(audio, targetVol = 0.78, duration = 1200) {
  audio.volume = 0;
  audio.play().catch(() => {});
  const step = targetVol / (duration / 50);
  const id = setInterval(() => {
    if (audio.volume + step >= targetVol) { audio.volume = targetVol; clearInterval(id); }
    else audio.volume += step;
  }, 50);
}

function fadeOut(audio, duration = 400, onDone) {
  const start = audio.volume;
  const step  = start / (duration / 50);
  const id = setInterval(() => {
    if (audio.volume - step <= 0.01) {
      audio.volume = 0;
      audio.pause();
      audio.currentTime = 0;
      clearInterval(id);
      if (onDone) onDone();
    } else {
      audio.volume -= step;
    }
  }, 50);
}

/* ── Matrix Canvas ── */
const canvas  = $('matrixCanvas');
const ctx     = canvas.getContext('2d');
let columns   = [];
let matrixRAF = null;
let matrixOn  = false;

const CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789';

function initMatrix() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const colW = 18;
  const numCols = Math.floor(canvas.width / colW);
  columns = Array.from({ length: numCols }, () => ({
    x: 0,
    y: Math.random() * -canvas.height,
    speed: 12 + Math.random() * 16,
  }));
  columns.forEach((c, i) => c.x = i * colW + colW / 2);
}

function drawMatrix() {
  ctx.fillStyle = 'rgba(6,6,8,0.18)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.font = '13px "Space Mono", monospace';

  columns.forEach(col => {
    const char = CHARS[Math.floor(Math.random() * CHARS.length)];
    // Head — bright white/pink
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#ff2d78';
    ctx.shadowBlur  = 8;
    ctx.fillText(char, col.x, col.y);

    // Trail — neon pink
    ctx.fillStyle = '#ff2d78';
    ctx.shadowColor = '#ff2d78';
    ctx.shadowBlur  = 6;
    const trailChar = CHARS[Math.floor(Math.random() * CHARS.length)];
    ctx.fillText(trailChar, col.x, col.y - 18);

    ctx.shadowBlur = 0;

    col.y += col.speed;
    if (col.y > canvas.height + 50) {
      col.y = -20 - Math.random() * 200;
    }
  });
}

function startMatrix() {
  matrixOn = true;
  canvas.classList.add('visible');
  function loop() {
    if (!matrixOn) return;
    drawMatrix();
    matrixRAF = requestAnimationFrame(loop);
  }
  loop();
}

function stopMatrix() {
  matrixOn = false;
  cancelAnimationFrame(matrixRAF);
  // Fade out canvas
  canvas.style.transition = 'opacity 1.2s ease';
  canvas.style.opacity = '0';
}

window.addEventListener('resize', () => {
  if (matrixOn) initMatrix();
});

/* ── Phase helpers ── */
function showPhase(el) {
  el.classList.remove('hidden');
  requestAnimationFrame(() => el.classList.add('visible'));
}
function hidePhase(el, cb) {
  el.classList.remove('visible');
  setTimeout(() => {
    el.classList.add('hidden');
    if (cb) cb();
  }, 950);
}

/* ── Countdown & Word sequence ── */
const countdownEl = $('countdownNum');
const wordEl      = $('wordDisplay');


// ── BPM sync: 83.4 BPM → 1 beat ≈ 720ms ──
const BEAT = 720;

function showNumber(n) {
  return new Promise(res => {
    countdownEl.textContent = n;
    countdownEl.classList.add('show');
    // show for 1 beat, fade out in 120ms, gap fills rest
    setTimeout(() => {
      countdownEl.classList.remove('show');
      setTimeout(res, 120);
    }, BEAT - 120);
  });
}

function showWord(word) {
  return new Promise(res => {
    wordEl.textContent = word;
    wordEl.classList.add('show');
    // show for 2 beats, quick fade
    setTimeout(() => {
      wordEl.classList.remove('show');
      setTimeout(res, 150);
    }, BEAT * 2 - 150);
  });
}

async function runPhase2Sequence() {
  await delay(BEAT / 2); // yarım beat — phase1 fade bitir, rəqəm dərhal gəlir
  await showNumber(3);
  await showNumber(2);
  await showNumber(1);

  const words = ['HAPPY', 'BIRTHDAY', 'TO', 'LALƏ!'];
  for (const w of words) await showWord(w);

  await delay(BEAT);
  hidePhase($('phase2'), () => {
    stopMatrix();
    enterPhase3();
  });
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ── Phase 3 particles ── */
function spawnParticles(n = 28) {
  const container = $('particles');
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const left     = Math.random() * 100;
    const duration = 8 + Math.random() * 14;
    const drift    = (Math.random() - 0.5) * 120 + 'px';
    const delay_   = Math.random() * duration;
    p.style.cssText = `
      left: ${left}%;
      bottom: 0;
      --drift: ${drift};
      animation: floatUp ${duration}s ${delay_}s linear infinite;
      width: ${1 + Math.random() * 2}px;
      height: ${1 + Math.random() * 2}px;
    `;
    container.appendChild(p);
  }
}

/* ── Card interaction ── */
let cardOpened = false;

function setupCard() {
  const wrapper = $('cardWrapper');
  const front   = $('cardFront');
  const back    = $('cardBack');

  function openCard(e) {
    e.preventDefault();
    e.stopPropagation();
    if (cardOpened) return;
    cardOpened = true;

    wrapper.classList.add('opened');
    wrapper.setAttribute('aria-expanded', 'true');
    front.setAttribute('aria-hidden', 'true');
    back.setAttribute('aria-hidden',  'false');

    // iOS Safari-də volume dəyişmir — birbaşa pause et
    music1.pause();
    music1.volume = 0;
    music1.currentTime = 0;

    // music2-ni dərhal başlat
    music2.volume = 0;
    const playPromise = music2.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        fadeIn(music2, 0.78, 1200);
      }).catch(() => {
        // autoplay blocked — try once more on next user gesture
        music2.volume = 0.78;
      });
    }
  }

  // touchend fires reliably on mobile without 300ms delay
  wrapper.addEventListener('touchend', openCard, { passive: false });
  // click handles desktop mouse
  wrapper.addEventListener('click', openCard);
  wrapper.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') openCard(e);
  });
}

/* ── Phase 3 entry ── */
function enterPhase3() {
  showPhase($('phase3'));
  spawnParticles(30);
  setupCard();
}

/* ── PHASE 1 START BUTTON ── */
$('startBtn').addEventListener('click', () => {
  music1.play().then(() => { music1.volume = 0.75; }).catch(() => { music1.volume = 0.75; });

  // Fade out phase1, but immediately start phase2 behind it — no waiting
  $('phase1').classList.remove('visible');
  setTimeout(() => $('phase1').classList.add('hidden'), 900);

  initMatrix();
  showPhase($('phase2'));
  startMatrix();
  runPhase2Sequence();
});
</script>
</body>
</html>
